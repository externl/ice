plugins {
    id 'com.android.application' version '8.13.2'
}

android {
    namespace = 'com.zeroc.icebttest'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.zeroc.icebttest'
        minSdk = 34 // required for Java 17 compatibility (matches the Ice Android controller app)
        targetSdk = 36
        versionCode = 1
        versionName = '1.0'
        multiDexEnabled = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    signingConfigs {
        debug {
            // Explicit keystore (generated by the workflow) so we don't depend on the CI runner
            // having an auto-generated ~/.android/debug.keystore.
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled = false
        }
    }

    packaging {
        resources {
            // The Ice jars bundle overlapping non-code resources (javadoc, license/legal files) that
            // collide when merged into one APK; none matter at runtime for this spike. Take the first
            // of any duplicate rather than enumerating every colliding path.
            pickFirsts += ["**"]
        }
    }
}

dependencies {
    // The Ice + IceBT Java libraries, built by `make -C cpp srcs` (slice2java) + `make -C java srcs`.
    implementation fileTree(dir: "${rootProject.projectDir}/../../java/lib", include: ["ice-*.jar", "icebt-*.jar"])
    runtimeOnly "org.apache.commons:commons-compress:1.20"
}
